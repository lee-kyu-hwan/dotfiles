version = 1

# 이 파일에는 비밀이 아닌 별칭·범위·경로만 둔다. 각 config_home의 인증은
# host마다 공식 login 흐름으로 별도 설정하며 디렉터리나 token을 복제하지 않는다.
[accounts.codex-dotfiles]
provider = "codex"
auth_kind = "consumer"
config_home = "~/.local/share/ai-account-profiles/codex/dotfiles"
allowed_scopes = ["repository:lee-kyu-hwan/dotfiles"]

[accounts.claude-dotfiles]
provider = "claude"
auth_kind = "consumer"
config_home = "~/.local/share/ai-account-profiles/claude/dotfiles"
allowed_scopes = ["repository:lee-kyu-hwan/dotfiles"]

[defaults]
codex = "codex-dotfiles"
claude = "claude-dotfiles"

[[scope_bindings]]
kind = "repository"
value = "lee-kyu-hwan/dotfiles"
provider = "codex"
account_profile = "codex-dotfiles"

[[scope_bindings]]
kind = "repository"
value = "lee-kyu-hwan/dotfiles"
provider = "claude"
account_profile = "claude-dotfiles"
