schema_version = 2
contract_id = "orchestrator-permission-profiles-v2"
task_bindings = []
session_bindings = []

# Active records contain only non-secret aliases, modes, and reviewed paths.
# Authentication remains in each provider's official home and is never copied.
[[accounts]]
alias = "codex-default"
provider = "codex"
auth_kind = "consumer"
config_home = "~/.codex"
allowed_scopes = [{ kind = "directory", value = "~/code" }]
identity_enrollment_policy = "explicit_only"
identity_contract = "unavailable"
usage_contract = "none"

[[accounts]]
alias = "claude-profile1"
provider = "claude"
auth_kind = "consumer"
config_home_mode = "explicit"
config_home = "~/.local/share/ai-account-profiles/claude/profile1"
allowed_scopes = [{ kind = "directory", value = "~/code/profile1" }]
identity_enrollment_policy = "explicit_only"
identity_contract = "claude_auth_status_v1"
usage_contract = "none"

[[accounts]]
alias = "claude-profile2"
provider = "claude"
auth_kind = "consumer"
config_home_mode = "explicit"
config_home = "~/.local/share/ai-account-profiles/claude/profile2"
allowed_scopes = [{ kind = "directory", value = "~/code/profile2" }]
identity_enrollment_policy = "explicit_only"
identity_contract = "claude_auth_status_v1"
usage_contract = "none"

[[workspace_directory_mappings]]
root = "~/code"
provider = "codex"
account_profile = "codex-default"
priority = 100

[[workspace_directory_mappings]]
root = "~/code/profile1"
provider = "claude"
account_profile = "claude-profile1"
priority = 100

[[workspace_directory_mappings]]
root = "~/code/profile2"
provider = "claude"
account_profile = "claude-profile2"
priority = 100

# Opaque migration evidence. The strings below preserve the two deployed v1
# record byte spans and are deliberately outside the active account parser.
[legacy_records]
codex-dotfiles = '''[accounts.codex-dotfiles]
provider = "codex"
auth_kind = "consumer"
config_home = "~/.local/share/ai-account-profiles/codex/dotfiles"
allowed_scopes = ["repository:lee-kyu-hwan/dotfiles"]

'''
claude-dotfiles = '''[accounts.claude-dotfiles]
provider = "claude"
auth_kind = "consumer"
config_home = "~/.local/share/ai-account-profiles/claude/dotfiles"
allowed_scopes = ["repository:lee-kyu-hwan/dotfiles"]

'''
