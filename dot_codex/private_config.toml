profile = "full_auto"

[projects."/Users/lee-kyu-hwan/code/zambaguni-front"]
trust_level = "trusted"

[projects."/Users/lee-kyu-hwan/code/zambaguni-mobile"]
trust_level = "trusted"

[projects."/Users/lee-kyu-hwan/code/dotfiles"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "model", "git-branch", "pull-request-number", "run-state", "five-hour-limit", "used-tokens", "fast-mode"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "approve"
enabled_tools = [
  "browser_navigate",
  "browser_navigate_back",
  "browser_snapshot",
  "browser_click",
  "browser_hover",
  "browser_select_option",
  "browser_type",
  "browser_press_key",
  "browser_fill_form",
  "browser_take_screenshot",
  "browser_wait_for",
  "browser_console_messages",
  "browser_tabs",
  "browser_resize",
  "browser_close",
]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[profiles.full_auto]
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model = "gpt-5.5"
model_reasoning_effort = "xhigh"

[sandbox_workspace_write]
network_access = true

[notice]
fast_default_opt_out = true
